[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinite-tapestry"
version = "0.1.0"
description = "Endlessly scrolling AI-generated panorama (SD1.5 inpaint MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "boto3>=1.34",  # R2 is the only binary store (strips, tiles, canvas)
]

[project.optional-dependencies]
gpu = [
  "torch>=2.1.0",
  "diffusers>=0.30.0",
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "safetensors>=0.4.0",
  "sentencepiece>=0.2.0",
  "peft>=0.12.0",
]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
infinite-tapestry = "infinite_tapestry.main:main"

[tool.setuptools.packages.find]
include = ["infinite_tapestry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
