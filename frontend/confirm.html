<body class="page confirm-page">
  <!--chrome:header-->
  <main class="confirm">
    <img class="confirm-mark" src="/brand/mark-plain.svg" alt="" />
    <h1 id="c-title">Signing you in…</h1>
    <p id="c-text" class="fine"></p>
    <div id="c-retry" class="hidden">
      <form id="c-form" autocomplete="on">
        <input id="c-email" type="email" autocomplete="email" class="vibe" placeholder="you@example.com" required />
        <button id="c-send" class="primary wide" type="submit">Send a new link</button>
      </form>
      <form id="c-code-form" class="hidden" autocomplete="off">
        <input id="c-code" class="vibe code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" aria-label="6-digit code" />
      </form>
    </div>
    <a id="c-home" class="quiet-link hidden" href="/">Go to the tapestry →</a>
  </main>
  <!--chrome:footer-->
  <script src="/config.js"></script>
  <script type="module" src="/src/entries/confirm.ts"></script>
