  <div id="u-tl" aria-hidden="false">
    <canvas id="u-c" role="img" aria-label="Timeline"></canvas>
    <div id="u-marks" aria-hidden="true"></div>
    <div id="u-needle" aria-hidden="true"></div>
    <div class="u-hud">
      <div class="u-when"><span id="u-when">…</span><span id="u-era"></span></div>
      <div class="u-tools">
        <button id="u-zout" class="u-pill u-ic" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="u-zin" class="u-pill u-ic" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button id="u-all" class="u-pill" type="button" title="All of history">All</button>
        <button id="u-menuB" class="u-pill" type="button" aria-expanded="false" title="Calendar and options">Menu</button>
        <button id="u-live" class="u-pill u-live" type="button" title="Back to live (0)">Live →</button>
      </div>
    </div>
    <div id="u-menu" class="u-sheet" role="dialog" aria-label="Timeline menu">
      <h4>Jump to a day</h4><div id="u-cal"></div>
      <h4>Show events</h4><div class="row" id="u-cats"></div>
    </div>
    <div class="u-dock">
      <button id="u-prev" class="u-pill u-ic" type="button" title="Previous prompt ([)" aria-label="Previous prompt">‹</button>
      <span id="u-title"></span>
      <button id="u-next" class="u-pill u-ic" type="button" title="Next prompt (])" aria-label="Next prompt">›</button>
      <button id="u-play" class="u-pill" type="button" title="Play from here (space)">Play here</button>
    </div>
    <div id="u-toast" class="u-toast" role="status"></div>
    <div id="u-perf"></div>
  </div>
