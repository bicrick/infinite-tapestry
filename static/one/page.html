<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Infinite Tapestry</title>
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="one/one.css" />
  <link rel="stylesheet" href="one/ui/bar.css" />
</head>
<body>
  <canvas id="one-c" role="img" aria-label="Infinite Tapestry"></canvas>
  <div class="one-ui">
    <span id="one-clock" class="one-clock" aria-label="Current time"></span>
    <div id="one-dock" class="one-dock" role="group" aria-label="Composer and timeline controls"><span id="one-cap" class="one-cap"></span></div>
    <div class="one-hints" aria-hidden="true">Scroll · scrub &nbsp; Shift+scroll · zoom &nbsp; WASD / arrows &nbsp; Space · play &nbsp; L · live</div>
    <pre id="one-perf" class="one-perf" hidden></pre>
  </div>
  <script src="stipple-fill.js"></script>
  <script src="one/camera.js"></script>
  <script src="one/tile-store.js"></script>
  <script src="one/renderer.js"></script>
  <script src="one/passes/tiles.js"></script>
  <script src="one/passes/grain.js"></script>
  <script src="one/main.js"></script>
  <script src="one/ui/morph.js"></script>
  <script src="one/ui/bar.js"></script>
</body>
</html>
