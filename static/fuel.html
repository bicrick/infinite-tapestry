  <main class="doc fuel-page">
    <h1>Fuel</h1>
    <p class="lede">The tapestry paints nonstop on a rented GPU, with Auto directing between ideas. Here's what that costs and how much the crowd has chipped in.</p>
    <div class="fp-card">
      <div class="fuel-line big"><span id="fuel-fill-big"></span></div>
      <div class="fuel-caption" id="fuel-caption">…</div>
      <p class="fine" id="fuel-sub"></p>
      <svg id="fuel-chart" class="fuel-chart" viewBox="0 0 600 160" role="img" aria-label="Daily painting cost versus donations"></svg>
      <p id="fuel-chart-note" class="fine fuel-legend"></p>
    </div>
    <h2>Add fuel</h2>
    <div class="tiers" id="tiers">
      <button data-cents="300">$3<small>&nbsp;</small></button>
      <button data-cents="1000">$10<small>&nbsp;</small></button>
      <button data-cents="2500">$25<small>&nbsp;</small></button>
    </div>
    <input id="donor-note" class="vibe" maxlength="140" placeholder="A note for the wall (optional)" />
    <p class="fine" id="fuel-rate-note"></p>
    <p class="fine">Totally optional. Payments are handled by Stripe; card fees come out before fuel is counted. Donors are thanked on the <a href="/about">about page</a>.</p>
    <p class="fine" id="fuel-msg" role="status"></p>
  </main>
