<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Strip reveal lab · Infinite Tapestry</title>
  <style>
    :root { color-scheme: dark; --bg: #050506; --fg: #e8e6df; --muted: #8a8780; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
      font: 14px/1.45 "IBM Plex Sans", "Source Sans 3", ui-sans-serif, sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { font: 600 22px/1.2 "IBM Plex Serif", "Source Serif 4", Georgia, serif; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; max-width: 54ch; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    button { appearance: none; border: 1px solid #2a2a2e; background: #121214; color: var(--fg);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
    button:hover { border-color: #4a4a50; }
    button.primary { background: #e8e6df; color: #111; border-color: #e8e6df; }
    #stage { width: 100%; height: min(72vh, 640px); background: #0a0a0c; border: 1px solid #1c1c20;
      display: grid; place-items: center; overflow: hidden; }
    canvas { image-rendering: auto; max-width: 100%; max-height: 100%; }
    #meta { font-variant-numeric: tabular-nums; color: var(--muted); min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>Strip stipple reveal</h1>
    <p>Unlisted lab for the shared <code>strip-reveal.js</code> module. Loads one live CDN strip and replays the starry → stipple → colour → settle assembly.</p>
    <div class="row">
      <button class="primary" id="replay" type="button">Replay</button>
      <button id="next" type="button">Another strip</button>
      <span id="meta">Loading…</span>
    </div>
    <div id="stage"><canvas id="c" width="448" height="1024"></canvas></div>
  </main>
  <script src="/strip-reveal.js"></script>
  <script>
  (() => {
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: false });
    const meta = document.getElementById("meta");
    let bitmap = null, reveal = null, index = null, raf = 0, t0 = 0, frames = 0, msSum = 0;

    async function loadBitmap(url) {
      const blob = await fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.blob(); });
      if (bitmap && bitmap.close) bitmap.close();
      bitmap = await createImageBitmap(blob);
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
    }

    async function pickStrip() {
      // Local fixture first (offline lab / CI capture), then live CDN via /api/live.
      try {
        const meta = await fetch("/_lab/demo-strip.json").then((r) => { if (!r.ok) throw 0; return r.json(); });
        index = meta.index | 0;
        await loadBitmap("/_lab/demo-strip.webp");
        return meta;
      } catch (_) {}

      let live;
      try { live = await fetch("/api/live?n=1").then((r) => { if (!r.ok) throw 0; return r.json(); }); }
      catch (_) { live = await fetch("https://infinitetapestry.app/api/live?n=1").then((r) => r.json()); }
      const max = live.max | 0;
      const base = (live.config && live.config.strip_base) || "";
      const ext = (live.config && live.config.strip_ext) || "webp";
      // Prefer a strip a little behind the tip so the CDN object is warm.
      index = Math.max(0, max - 8 - ((Math.random() * 40) | 0));
      const url = base + String(index).padStart(8, "0") + "." + ext;
      await loadBitmap(url);
      return live;
    }

    function startReveal() {
      if (!bitmap || !window.TapestryStripReveal) return;
      if (reveal) reveal.dispose();
      frames = 0; msSum = 0; t0 = performance.now();
      reveal = TapestryStripReveal.start(bitmap, { now: t0, seed: index * 2654435761 });
      meta.textContent = reveal
        ? `strip ${index} · revealing…`
        : `strip ${index} · skipped (reduced-motion or budget)`;
      cancelAnimationFrame(raf);
      loop();
    }

    function loop() {
      raf = requestAnimationFrame((now) => {
        const t1 = performance.now();
        ctx.fillStyle = "#0a0a0c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (reveal && !reveal.done) {
          reveal.tick(now);
          reveal.draw(ctx, 0, 0);
          frames++;
          msSum += performance.now() - t1;
          meta.textContent = `strip ${index} · ${reveal.phase} · ${(now - t0) | 0} ms · draw ${(msSum / frames).toFixed(2)} ms avg`;
        } else {
          ctx.drawImage(bitmap, 0, 0);
          if (reveal) {
            meta.textContent = `strip ${index} · settled · ${frames} frames · draw ${(msSum / Math.max(1, frames)).toFixed(2)} ms avg`;
            reveal.dispose(); reveal = null;
          }
          return;
        }
        loop();
      });
    }

    document.getElementById("replay").onclick = () => startReveal();
    document.getElementById("next").onclick = async () => {
      meta.textContent = "Loading…";
      try { await pickStrip(); startReveal(); }
      catch (e) { meta.textContent = "Failed: " + e.message; }
    };

    pickStrip().then(startReveal).catch((e) => { meta.textContent = "Failed: " + e.message; });
  })();
  </script>
</body>
</html>
