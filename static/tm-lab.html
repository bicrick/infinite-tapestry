<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Time Machine · Infinite Tapestry</title>
  <meta name="description" content="Everything the Infinite Tapestry has ever painted, as one line you can zoom." />
  <link rel="icon" href="/brand/mark.svg" type="image/svg+xml" />
  <!--chrome:head-->
  <link rel="stylesheet" href="/tm-lab.css" />
  <script src="/theme.js"></script>
</head>
<body class="tml">
  <!--chrome:header overlay-->
  <canvas id="c" aria-label="Every strip ever painted, as one zoomable line"></canvas>
  <div id="marks" aria-hidden="true"></div>
  <div id="needle" aria-hidden="true"></div>
  <div id="hud" class="tml-hud">
    <div class="tml-when"><span id="when">…</span><span id="era"></span></div>
    <div class="tml-tools"><button id="all" class="tml-pill" type="button" title="Zoom out to all of history">All</button><button id="menuB" class="tml-pill" type="button" aria-expanded="false" title="Calendar and options">Calendar</button></div>
  </div>
  <div id="menu" class="tml-sheet" role="dialog" aria-label="Time Machine menu">
    <h4>Jump to a day</h4><div id="cal"></div>
    <h4>Step through</h4>
    <div class="row"><button id="mScenes" class="tml-pill on" type="button">All prompts</button><button id="mIdeas" class="tml-pill" type="button">Ideas only</button></div>
    <h4>Show</h4>
    <div class="row"><button id="mMarks" class="tml-pill on" type="button">Landmarks</button><span class="theme-toggle" data-theme-toggle><button type="button" data-t="">Auto</button><button type="button" data-t="light">Light</button><button type="button" data-t="dark">Dark</button></span></div>
    <p class="tml-note"><a href="/time-machine">Classic calendar view</a></p>
  </div>
  <div id="bot" class="tml-dock">
    <button id="prev" class="tml-pill tml-ic" type="button" title="Previous prompt (,)" aria-label="Previous prompt">‹</button>
    <span id="title"></span>
    <button id="next" class="tml-pill tml-ic" type="button" title="Next prompt (.)" aria-label="Next prompt">›</button>
    <button id="play" class="tml-pill" type="button" title="Play from here (space)">Play here</button>
    <button id="live" class="tml-pill" type="button" title="Newest strips, a few minutes behind live">Latest →</button>
  </div>
  <div id="toast" class="tml-toast" role="status"></div>
  <div id="perf"></div>
  <!--chrome:scripts-->
  <script src="/tm-lab.js"></script>
</body>
</html>
