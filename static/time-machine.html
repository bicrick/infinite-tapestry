<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="description" content="Everything the tapestry has ever painted, day by day." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Infinite Tapestry" />

  <meta name="twitter:card" content="summary_large_image" />

<body class="tm">
  <nav class="nav">
    <a href="/about" aria-label="About Infinite Tapestry"><img class="mark" src="/brand/mark-plain.svg" alt="" />Time machine</a>
    <div class="links"><a href="/">Live →</a></div>
  </nav>
  <main class="tm-main">
    <section class="cal" aria-label="Calendar">
      <div class="cal-h"><button id="m-prev" class="cal-nav" type="button" aria-label="Previous month">‹</button><h2 id="m-title">—</h2><button id="m-next" class="cal-nav" type="button" aria-label="Next month">›</button></div>
      <div class="cal-dow" id="dow"></div>
      <div class="cal-grid" id="grid"><p class="small">Loading history…</p></div>
    </section>
    <section class="day" id="day" aria-live="polite">
      <div class="day-h"><h3 id="d-title"></h3><span class="small" id="d-meta"></span></div>
      <div class="chips" id="d-chips"></div>
      <ol class="hours" id="d-hours"></ol>
    </section>
  </main>
  <script src="/time-machine.js" defer></script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments)};</script>

<script defer src="/_vercel/speed-insights/script.js"></script>
