name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package (dev)
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q
      - name: Syntax-check JS (static/ and web/)
        run: |
          set -e
          find static web -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Never show "Claude" in the UI
        run: |
          if grep -rIl "Claude" static/*.html static/*.js static/*.css; then echo "UI mentions Claude"; exit 1; fi

  # Versioned pod worker: every green main commit becomes deploy/worker/<sha>.tgz; the pod pulls latest on restart.
  publish-worker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish worker release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/publish_worker.sh

  deploy-web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_wWQb6uWytPTAvJCeSYirxFb5
      VERCEL_PROJECT_ID: prj_e5dEKiID5ny43SV89OWxDOvSgjrG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        env:
          WS_URL: wss://zdv2dvvabzk76k-8000.proxy.runpod.net/ws
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          R2_PUBLIC_URL: https://pub-631bdb4d40c54807b1c2de9402e07893.r2.dev
        run: bash scripts/build_web.sh "$RUNNER_TEMP/web"
      - name: Deploy to production and point the domain at it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/web"
          URL=$(npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -1)
          echo "deployed $URL"
          # smoke test before the domain moves (deployment URLs are protected; the bypass secret gets through)
          curl -sf "$URL/api/live?n=1&x-vercel-protection-bypass=$VERCEL_BYPASS" | grep -q '"config"'
          curl -sf "$URL/?x-vercel-protection-bypass=$VERCEL_BYPASS" | grep -q 'client.js'
          npx -y vercel@latest alias set "$URL" infinite-tapestry.vercel.app --token "$VERCEL_TOKEN"
