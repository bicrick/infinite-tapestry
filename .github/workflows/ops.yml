name: Ops
# Manual operations that need no laptop or box: Actions -> Ops -> Run workflow.
#   pod-health  sample the prod pod's /health for 2 min (throughput, R2 writes, alarms)
# Redeploys live in CI (Actions -> CI -> Run workflow, optionally force_worker).
on:
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [pod-health]
        default: pod-health
permissions:
  contents: read
concurrency:
  group: ops-${{ inputs.task }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pod-health
        if: inputs.task == 'pod-health'
        run: python3 scripts/ops/pod_health.py 120
