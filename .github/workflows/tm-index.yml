name: Time Machine index
# Every 5 minutes: fold new strips into the precomputed history index (tm/idx/* in Supabase Storage,
# mirrored to R2 when the R2_* secrets exist). Resumable; /api/about?kind=history adds the live tail itself,
# so a late or skipped run only costs a slightly bigger tail read, never stale data.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild from the very first strip"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: tm-index, cancel-in-progress: false }
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/tm/build_index.js ${{ inputs.rebuild && '--rebuild' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
