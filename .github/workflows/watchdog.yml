name: Watchdog
# Every 5 minutes: if the pod should be painting but no strip has landed for 3+ minutes, fail loudly.
# Notifications: GitHub emails the account that owns the schedule on failed scheduled runs (Settings ->
# Notifications -> Actions: "Send notifications for failed workflows only"). On failure this job also opens
# (or comments on) one "Watchdog: stall" issue, which emails everyone watching the repo; it closes itself on recovery.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Schedules only run from main; this lets a PR that edits the watchdog exercise the check (issue steps skip on PRs).
  pull_request:
    branches: [main]
    paths: [.github/workflows/watchdog.yml]
permissions:
  issues: write
  contents: read
jobs:
  strips-fresh:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://infinite-tapestry.vercel.app' }}
    steps:
      - name: Check the newest strip age
        id: check
        run: |
          set -euo pipefail
          J=$(curl -sf --retry 3 "${SITE_URL%/}/api/live?n=1")
          python3 - "$J" <<'PY'
          import json, sys
          j = json.loads(sys.argv[1]); age = j["now"] - (j["last_at"] or 0); pod = j.get("pod") or {}
          print(f"newest strip {j['max']} is {age/60:.1f} min old; pod {pod}")
          if pod.get("status") == "running" and pod.get("desired") != "off" and age > 180:
              sys.exit(f"STALL: no new strip for {age/60:.0f} min while the pod is running")
          PY
      - name: Open or update the stall issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label watchdog --json number -q '.[0].number' 2>/dev/null || true)
          MSG="Watchdog failed at $(date -u +%FT%TZ): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$N" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" -b "$MSG"
          else gh label create watchdog -R "$GITHUB_REPOSITORY" -c B60205 2>/dev/null || true
               gh issue create -R "$GITHUB_REPOSITORY" -t "Watchdog: stall" -l watchdog -b "$MSG"; fi
      - name: Close the stall issue on recovery
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --label watchdog --json number -q '.[].number' 2>/dev/null); do
            gh issue close "$N" -R "$GITHUB_REPOSITORY" -c "Recovered at $(date -u +%FT%TZ)."; done
