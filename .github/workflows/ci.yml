name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: Syntax-check JS (static/ and web/)
        run: |
          set -e
          find static web -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check
